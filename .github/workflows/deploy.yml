name: Deploy Gaming VPN to Server

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose and configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/var/www/madacore-vpn"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo mkdir -p /var/www/madacore-vpn
            sudo chown -R $USER:$USER /var/www/madacore-vpn
            cd /var/www/madacore-vpn

            # Apply Kernel Tuning automatically on the VPS host
            echo "[*] Optimizing Host Kernel..."
            sudo tee /etc/sysctl.d/99-gaming-vpn.conf <<EOF
            net.core.rmem_max = 16777216
            net.core.wmem_max = 16777216
            net.core.rmem_default = 262144
            net.core.wmem_default = 262144
            net.core.netdev_max_backlog = 10000
            net.core.default_qdisc = fq
            net.ipv4.tcp_congestion_control = bbr
            net.ipv4.ip_forward = 1
            EOF
            sudo sysctl --system

            # Tune Network Interface transmit queue length
            DEFAULT_INTERFACE=$(ip route show default | awk '/default/ {print $5}')
            if [ -n "$DEFAULT_INTERFACE" ]; then
              sudo ip link set dev "$DEFAULT_INTERFACE" txqueuelen 10000
            fi

            # Create production .env file if it doesn't exist
            if [ ! -f .env ]; then
              echo "SERVER_URL=$(curl -s https://ifconfig.me)" > .env
              echo "TZ=Etc/UTC" >> .env
              echo "WG_PORT=51820" >> .env
              echo "CLIENTS_COUNT=1" >> .env
            fi

            # Set image name environment variable
            export DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Log in to GHCR
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and Deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Clean up dangling images
            docker image prune -f

version: '3.8'

services:
  wireguard:
    image: ${DOCKER_IMAGE:-lscr.io/linuxserver/wireguard:latest}
    container_name: gaming-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - SERVERURL=${SERVER_URL:-auto}
      - SERVERPORT=${WG_PORT:-51820}
      - PEERS=${CLIENTS_COUNT:-1}
      - PEERDNS=${PEER_DNS:-1.1.1.1,8.8.8.8}
      - INTERNAL_SUBNET=10.0.0.0
      - ALLOWEDIPS=0.0.0.0/0
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  vpn-monitor:
    build:
      context: ./strategies
      dockerfile: Dockerfile.monitor
    container_name: vpn-monitor
    ports:
      - "127.0.0.1:${MONITOR_PORT:-10000}:${MONITOR_PORT:-10000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WG_CONTAINER_NAME=gaming-wireguard
      - WG_INTERFACE=wg0
      - MONITOR_PORT=${MONITOR_PORT:-10000}
    depends_on:
      - wireguard
    restart: unless-stopped

